# data disk free-space rules, file provisioned into grafana unified alerting
# (written to <runDir>/provisioning/alerting by main.go at container start).
#
# the rules query the node_exporter_metrics filesystem series that fluent-bit
# remote-writes from every host (labels env/host/job=node, see the fluent-bit
# templates in xops). each data disk is watched on its own mountpoint:
# - /mnt/data, the zfs pool of every redis node host (by-us-fmt-5-edge-6 and
#   by-us-fmt-5-edge-5): the redis cluster's dumps and saves, and on edge-6 the
#   redis backups. edge-6's pool also held the minio store until october 2026,
#   when a full pool stopped every minio write, the redis backups and redis
#   saves at once; it filled unnoticed twice that month.
# - /mnt/blob1 .. /mnt/blob4 on by-us-fmt-5-edge-5, the xfs drives of the one
#   minio erasure set now behind loki, mimir and the server blob bucket. minio
#   fails every write once one drive of the set is full ("minimum free drive
#   threshold"), so each drive alerts by itself.
#
# warn at 15% free left about a day at the loki ingest seen on edge-6's pool in
# october. on a minio drive it leaves more than a week at the ~45 GiB/day each
# drive lost after the move, and page at 5% about four days. alert exprs carry
# no env filter, as in redis-cluster.yml.
apiVersion: 1
groups:
  - orgId: 1
    name: data-disk
    folder: urnetwork alerts
    interval: 1m
    rules:
      - uid: data-disk-low
        title: DataDiskLow
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max by (env, host, mountpoint) (node_filesystem_avail_bytes{mountpoint=~"/mnt/data|/mnt/blob[0-9]+"}) / max by (env, host, mountpoint) (node_filesystem_size_bytes{mountpoint=~"/mnt/data|/mnt/blob[0-9]+"} > 0)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [0.15], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: {service: data-disk, severity: warn}
        annotations:
          summary: '{{ $labels.host }} {{ $labels.mountpoint }} is below 15% free (free fraction {{ $values.A }}).'
        isPaused: false

      - uid: data-disk-critical
        title: DataDiskCritical
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max by (env, host, mountpoint) (node_filesystem_avail_bytes{mountpoint=~"/mnt/data|/mnt/blob[0-9]+"}) / max by (env, host, mountpoint) (node_filesystem_size_bytes{mountpoint=~"/mnt/data|/mnt/blob[0-9]+"} > 0)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [0.05], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: {service: data-disk, severity: page}
        annotations:
          summary: '{{ $labels.host }} {{ $labels.mountpoint }} is below 5% free (free fraction {{ $values.A }}); a full minio drive stops every minio write, a full /mnt/data the redis saves and backups.'
        isPaused: false

      # the two rules above only see disks that report the series, so a silent
      # shipper or an unmounted drive would hide the disks that matter most.
      # fail closed on each: both redis pools and the four minio drives. the
      # uid predates edge-5's disks and is kept so a provisioned copy of the
      # rule updates in place.
      - uid: data-disk-edge-6-telemetry-missing
        title: DataDiskTelemetryMissing
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: >-
                absent(node_filesystem_avail_bytes{env="main",host="by-us-fmt-5-edge-6",mountpoint="/mnt/data"})
                or absent(node_filesystem_avail_bytes{env="main",host="by-us-fmt-5-edge-5",mountpoint="/mnt/data"})
                or absent(node_filesystem_avail_bytes{env="main",host="by-us-fmt-5-edge-5",mountpoint="/mnt/blob1"})
                or absent(node_filesystem_avail_bytes{env="main",host="by-us-fmt-5-edge-5",mountpoint="/mnt/blob2"})
                or absent(node_filesystem_avail_bytes{env="main",host="by-us-fmt-5-edge-5",mountpoint="/mnt/blob3"})
                or absent(node_filesystem_avail_bytes{env="main",host="by-us-fmt-5-edge-5",mountpoint="/mnt/blob4"})
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: {service: data-disk, severity: warn}
        annotations:
          summary: '{{ $labels.host }} has reported no {{ $labels.mountpoint }} free space for 15 minutes.'
        isPaused: false
