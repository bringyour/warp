# data disk free-space rules, file provisioned into grafana unified alerting
# (written to <runDir>/provisioning/alerting by main.go at container start).
#
# the rules query the node_exporter_metrics filesystem series that fluent-bit
# remote-writes from every host (labels env/host/job=node, see the fluent-bit
# templates in xops). /mnt/data is the data disk: on by-us-fmt-5-edge-6 one
# zfs pool holds the redis cluster's dumps, the redis backups and the minio
# store behind loki, mimir and the server blob bucket. a full pool stops every
# minio write ("minimum free drive threshold"), the redis backups and redis
# saves at once, and it filled unnoticed twice in october 2026.
#
# warn at 15% free leaves about a day at the loki ingest seen in october; page
# at 5% leaves hours. alert exprs carry no env filter, as in redis-cluster.yml.
apiVersion: 1
groups:
  - orgId: 1
    name: data-disk
    folder: urnetwork alerts
    interval: 1m
    rules:
      - uid: data-disk-low
        title: DataDiskLow
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max by (env, host) (node_filesystem_avail_bytes{mountpoint="/mnt/data"}) / max by (env, host) (node_filesystem_size_bytes{mountpoint="/mnt/data"} > 0)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [0.15], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: {service: data-disk, severity: warn}
        annotations:
          summary: '{{ $labels.host }} /mnt/data is below 15% free (free fraction {{ $values.A }}).'
        isPaused: false

      - uid: data-disk-critical
        title: DataDiskCritical
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'max by (env, host) (node_filesystem_avail_bytes{mountpoint="/mnt/data"}) / max by (env, host) (node_filesystem_size_bytes{mountpoint="/mnt/data"} > 0)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [0.05], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: {service: data-disk, severity: page}
        annotations:
          summary: '{{ $labels.host }} /mnt/data is below 5% free (free fraction {{ $values.A }}); minio, redis saves and backups stop when it fills.'
        isPaused: false

      # the two rules above only see hosts that report the series, so a silent
      # edge-6 shipper would hide the disk that matters most. fail closed on it.
      - uid: data-disk-edge-6-telemetry-missing
        title: DataDiskTelemetryMissing
        condition: B
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: warp-mimir
            model:
              editorMode: code
              expr: 'absent(node_filesystem_avail_bytes{env="main",host="by-us-fmt-5-edge-6",mountpoint="/mnt/data"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              legendFormat: __auto
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: {service: data-disk, severity: warn}
        annotations:
          summary: by-us-fmt-5-edge-6 has reported no /mnt/data free space for 15 minutes.
        isPaused: false
